name: Release Extension

on:
  push:
    tags:
      - 'v*' # 当推送 v 开头的标签时触发

permissions:
  contents: write # 添加写入权限

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 获取完整的 git 历史用于生成更新日志

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.12.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.7.6

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm run build

      - name: Create ZIP file
        run: |
          cd dist
          zip -r ../humi-${{ env.VERSION }}.zip *
          cd ..

      - name: Install crx package
        run: pnpm add -g crx

      - name: Generate private key
        run: |
          echo "${{ secrets.EXTENSION_PRIVATE_KEY }}" > private.pem
        env:
          EXTENSION_PRIVATE_KEY: ${{ secrets.EXTENSION_PRIVATE_KEY }}

      - name: Package CRX
        run: |
          crx pack dist \
            -o humi-${{ env.VERSION }}.crx \
            -p private.pem

      - name: Verify files exist
        run: |
          ls -la humi-${{ env.VERSION }}.zip
          ls -la humi-${{ env.VERSION }}.crx

      - name: Cleanup private key
        run: rm -f private.pem

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ env.VERSION }}
          files: |
            humi-${{ env.VERSION }}.zip
            humi-${{ env.VERSION }}.crx
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}